# The Kinetic Topography - local stack
#   web : nginx serving the static WebGL client, proxying /api -> auth service
#   api : dependency-free Node auth service with a deliberate verification delay
#         (the delay is the point: it is the "tension" window the gyroscope fills)
services:
  api:
    image: node:22-alpine
    container_name: kt-api
    working_dir: /app
    command: ["node", "server.js"]
    volumes:
      - ./server:/app:ro
    environment:
      PORT: "8080"
      # Verification is padded into this window so Phase 2 has room to breathe.
      AUTH_MIN_DELAY_MS: "1500"
      AUTH_MAX_DELAY_MS: "2400"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    container_name: kt-web
    depends_on:
      - api
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8088:80"
    restart: unless-stopped
